name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Test tích hợp phải chạy thật trên CI, không được tự bỏ qua khi thiếu MongoDB
      REQUIRE_MONGO: '1'
      MONGODB_TEST_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
    steps:
      - uses: actions/checkout@v4

      # MongoDB 8 dạng replica set 1 node, giống docker-compose.yml.
      # Không dùng "services:" vì service container không truyền được tham số --replSet.
      - name: Khởi động MongoDB
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }" >/dev/null 2>&1 \
              && docker exec mongo mongosh --quiet --eval "quit(db.hello().isWritablePrimary ? 0 : 1)"; then
              echo "MongoDB sẵn sàng"; exit 0
            fi
            sleep 2
          done
          docker logs mongo
          exit 1

      - name: Cài pnpm theo packageManager
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
